<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./css/signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link 
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" 
        rel="stylesheet">
</head>
<body>
    <div class="signup-container">
        <h1>Sign up to Almeraa Laundry</h1>
        <form id="signupForm">
            <div class="form-group">
                <label for="profile_image">Profile Image URL</label>
                <input type="url" id="profile_image" name="profile_image" placeholder="https://example.com/image.jpg">
                <small id="profile_image_error" class="error"></small>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                <small id="username_error" class="error"></small>
            </div>
            <div class="form-group">
                <label for="password">Password (min 6 characters)</label>
                <input type="password" id="password" name="password" minlength="6" required>
                <small id="password_error" class="error"></small>
            </div>
            <div class="form-check">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">
                    I agree with Almeraa Laundry's 
                    <a href="#">Terms of Service</a>, 
                    <a href="#">Privacy Policy</a>, and 
                    default <a href="#">Notification Settings</a>.
                </label>
                <small id="terms_error" class="error"></small>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>                
        <div class="mt-3 text-center">
            Already have an account? <a href="../signin/signin.html">Sign In</a>
        </div>
    </div>

    <script src="./js/signup.js"></script>
</body>
</html>
